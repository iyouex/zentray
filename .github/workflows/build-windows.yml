name: build-windows

# Windows 安装包构建（feature/win-taskbar-center）
# 触发：push 到本分支（workflow_dispatch 仅默认分支可注册）
# 产物：zentray_<ver>_windows_x64.zip（onedir 全目录 zip，免安装解压即用）→ release v$ver
on:
  push:
    branches: [feature/win-taskbar-center]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: 生成 Windows 图标（.ico）
        run: >
          python -c "from PIL import Image; im = Image.open('resources/icons/app_icon.png');
          im.save('resources/icons/app_icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: PyInstaller 打包
        run: pyinstaller zentray.spec --noconfirm

      # 冒烟探针：直接 LoadLibraryEx 加载打包产物核心 DLL，复现/排除
      # "python312.dll LoadLibrary: 内存位置访问无效"（998）类加载失败。
      # CI 此前只打包不试运行，包能否加载从未被验证过。
      - name: 冒烟探针——LoadLibraryEx 直载核心 DLL
        shell: pwsh
        run: |
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class K32 { [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Unicode)] public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint flags); }'
          "OS: " + [System.Environment]::OSVersion.VersionString
          $dir = "dist/ZenTray/_internal"
          $targets = @(
            "$dir/python312.dll",
            "$dir/VCRUNTIME140.dll",
            "$dir/VCRUNTIME140_1.dll",
            "$dir/PySide6/PySide6Core.pyd"
          ) + (Get-ChildItem "$dir" -Depth 1 -Filter "Qt6Core.dll" | Select-Object -First 1 -ExpandProperty FullName)
          $failed = @()
          foreach ($t in $targets) {
            if (-not (Test-Path $t)) { "SKIP(不存在): $t"; continue }
            # 8 = LOAD_WITH_ALTERED_SEARCH_PATH，依赖从 DLL 自身目录解析，同 PyInstaller bootloader
            $h = [K32]::LoadLibraryEx($t, [IntPtr]::Zero, 8)
            if ($h -eq [IntPtr]::Zero) {
              $code = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
              $failed += "FAIL: $t -> Win32 错误 $code"
            } else { "OK: $t" }
          }
          if ($failed.Count -gt 0) { $failed; exit 1 }

      # 探针2：真正启动 exe。windowed 引导器在 DLL 加载失败时只弹 MessageBox（挂住，
      # 无法自动判读），故用 console=True 变体重打——失败信息直写 stderr 且立即退出。
      # 二分变量：strip=True（现状，疑为根因——GNU strip 削 MSVC PE）vs strip=False。
      - name: 冒烟探针2——启动 exe + strip 双变量二分
        shell: pwsh
        run: |
          "strip 路径: " + (Get-Command strip -ErrorAction SilentlyContinue).Source
          "源 python312.dll 哈希: " + (Get-FileHash "$env:pythonLocation\python312.dll").Hash
          function Test-ZenTrayLaunch($spec, $tag) {
            pyinstaller $spec --noconfirm --workpath "build-$tag" --distpath "dist-$tag"
            if ($tag -eq 'nostrip') {
              "nostrip python312.dll 哈希: " + (Get-FileHash "dist-$tag/ZenTray/_internal/python312.dll").Hash
            }
            $p = Start-Process "dist-$tag/ZenTray/ZenTray.exe" -WorkingDirectory "dist-$tag/ZenTray" -PassThru `
                 -RedirectStandardOutput "$tag-out.log" -RedirectStandardError "$tag-err.log"
            Start-Sleep -Seconds 25
            if ($p.HasExited) {
              "[$tag] FAIL 退出码 $($p.ExitCode)"
              Get-Content "$tag-err.log" -ErrorAction SilentlyContinue | Select-Object -First 5
              return $false
            }
            "[$tag] OK 存活 25s——bootloader 已加载 python312.dll 进入应用主循环"
            Stop-Process -Id $p.Id -Force
            return $true
          }
          $specBase = Get-Content zentray.spec -Raw
          $specBase -replace 'console\s*=\s*False', 'console=True' | Set-Content zentray-smoke-strip.spec
          $specBase -replace 'console\s*=\s*False', 'console=True' -replace 'strip\s*=\s*True', 'strip=False' |
            Set-Content zentray-smoke-nostrip.spec
          Test-ZenTrayLaunch 'zentray-smoke-strip.spec' 'strip' | Out-Null   # 定罪用，失败不挡流程
          if (-not (Test-ZenTrayLaunch 'zentray-smoke-nostrip.spec' 'nostrip')) { exit 1 }

      # 提交信息带 [smoke-only] 时跳过 zip+上传（排障探针运行不 churn release 资产）
      - name: 打 zip 并上传到 release v$ver（版本号取自 zentray/config.py）
        if: ${{ !contains(github.event.head_commit.message, '[smoke-only]') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path zentray/config.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $zip = "zentray_${ver}_windows_x64.zip"
          Compress-Archive -Path dist/ZenTray -DestinationPath "dist/$zip"
          gh release upload "v$ver" "dist/$zip" --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-log
          path: build/    # PyInstaller build 目录（warn 文件排障用），失败也保留
          if-no-files-found: ignore
