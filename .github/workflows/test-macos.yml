name: test-macos

# macOS 平台层自动化测试（feature/mac-support）
# 触发：push 到本分支（workflow_dispatch 仅默认分支可注册，feature 分支用 push 触发）
on:
  push:
    branches: [feature/mac-support]
  workflow_dispatch:

jobs:
  unit-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖（含 macOS 平台层 pyobjc）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mac]"

      - name: 平台环境信息
        run: |
          sw_vers
          python -VV

      - name: 单元测试（offscreen）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/unit -q --tb=short

      - name: macOS 平台模块导入验证
        run: |
          python - <<'EOF'
          import zentray.ui.mac_tray as m
          from zentray.services.system_utils import mac_hotkey_parse
          print("mac_tray:", m.__file__)
          print("hotkey ⌥space ->", mac_hotkey_parse("<alt>+<space>"))
          EOF
