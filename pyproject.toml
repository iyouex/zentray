[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zentray"
version = "0.7.2"
description = "Ubuntu/Linux 个人任务管理与专注效率工具 —— 系统托盘番茄钟 + GTD 看板"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zen-Geek"}
]
keywords = ["todo", "productivity", "pomodoro", "gtd", "tray", "task-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Desktop Environment",
]

requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "requests>=2.31.0",
    "pynput>=1.7.6",
    "injector>=0.21.0",
    "pyzipper>=0.3.6",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
]
# macOS 平台层（NSStatusItem 托盘 / UN 系统通知 / SMAppService 登录项）；
# 热键走 Carbon ctypes，无需额外依赖。Linux/Windows 不装。
mac = [
    "pyobjc-framework-Cocoa>=9.0",
    "pyobjc-framework-UserNotifications>=9.0",
    "pyobjc-framework-ServiceManagement>=9.0",
]

[project.scripts]
zentray = "zentray.main:main"

[project.urls]
Homepage = "https://github.com/zen-geek/zentray"
Issues = "https://github.com/zen-geek/zentray/issues"
Documentation = "https://github.com/zen-geek/zentray#readme"

[tool.setuptools.packages.find]
include = ["zentray*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
